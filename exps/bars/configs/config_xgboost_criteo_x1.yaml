---
model: xgboost
dataset: criteo_x1
num_features: [I1, I2, I3, I4, I5, I6, I7, I8, I9, I10, I11, I12, I13]
cat_features: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14, C15, C16, C17, C18, C19, C20, C21, C22, C23, C24, C25, C26]
data_dir: data/Criteo_x1
max_train_rows: null
verbose: false

model_params:
  device: cuda
  tree_method: hist
  enable_categorical: true
  random_state: 2021
  objective: binary:logistic
  eval_metric: [logloss, auc]
  n_estimators: 10000
  early_stopping_rounds: 200
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 20
  subsample: 1.0
  colsample_bytree: 1.0
  reg_lambda: 1.0
  reg_alpha: 10.0
  gamma: 0
  max_bin: 256
  grow_policy: depthwise
  max_cat_to_onehot: 64
  max_cat_threshold: 64
  n_jobs: -1
